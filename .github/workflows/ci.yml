name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin metadata
        run: python3 scripts/versions.py --check

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --no-default-features --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --no-default-features

      - name: Conformance
        run: cargo run --locked --release --no-default-features -p conformance -- --all

      - name: Build
        run: cargo build --locked --no-default-features --release
